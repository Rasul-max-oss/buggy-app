<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PizzaShop — тренажёр тестировщика</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  
  .phone-frame {
    width: 375px;
    height: 760px;
    background: #000;
    border-radius: 40px;
    padding: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 3px #333;
    position: relative;
  }
  
  .phone-notch {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 26px;
    background: #000;
    border-radius: 0 0 18px 18px;
    z-index: 100;
  }
  
  .screen {
    width: 100%;
    height: 100%;
    background: #fff8f0;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  
  /* СТАТУС-БАР — баг: часы идут, но показывают неверный формат */
  .status-bar {
    height: 32px;
    background: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 20px 0;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
  }
  
  .status-icons { display: flex; gap: 4px; font-size: 11px; }
  
  /* ХЕДЕР */
  .header {
    background: linear-gradient(135deg, #ff6b35, #f7931e);
    color: white;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  
  .header h1 { font-size: 18px; }
  
  .cart-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    position: relative;
  }
  
  /* баг: счётчик корзины не обновляется */
  .cart-count {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #ff4757;
    color: white;
    font-size: 10px;
    min-width: 18px;
    height: 18px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }
  
  /* КОНТЕНТ */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    padding-bottom: 80px;
  }
  
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  
  /* КАТЕГОРИИ */
  .categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 12px;
    margin-bottom: 8px;
  }
  
  .cat-btn {
    padding: 8px 16px;
    background: white;
    border: 2px solid #ffe0cc;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    /* баг: активная категория визуально не выделяется */
  }
  
  .cat-btn.active {
    background: #ff6b35;
    color: white;
    border-color: #ff6b35;
  }
  
  /* КАРТОЧКА ПИЦЦЫ */
  .pizza-card {
    background: white;
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 12px;
    display: flex;
    gap: 12px;
    align-items: center;
    box-shadow: 0 2px 8px rgba(255,107,53,0.08);
    cursor: pointer;
  }
  
  .pizza-img {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    background: #ffe0cc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    flex-shrink: 0;
  }
  
  .pizza-info { flex: 1; min-width: 0; }
  .pizza-info h3 { font-size: 15px; margin-bottom: 4px; color: #333; }
  .pizza-info p { font-size: 12px; color: #888; margin-bottom: 8px; }
  
  .pizza-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .pizza-price { font-size: 16px; font-weight: 700; color: #ff6b35; }
  
  .add-btn {
    background: #ff6b35;
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  
  /* КНОПКИ */
  .btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #ff6b35, #f7931e);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 8px;
    font-family: inherit;
  }
  
  .btn:active { opacity: 0.8; }
  .btn-secondary { background: #e0e0e0; color: #333; }
  .btn-danger { background: #ff4757; }
  .btn-success { background: #26de81; }
  
  /* НАВИГАЦИЯ */
  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 68px;
    background: white;
    display: flex;
    border-top: 1px solid #eee;
    padding-bottom: 8px;
  }
  
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #999;
    font-size: 10px;
    gap: 3px;
    border: none;
    background: none;
    font-family: inherit;
  }
  
  .nav-item.active { color: #ff6b35; }
  .nav-icon { font-size: 20px; }
  
  /* КОРЗИНА */
  .cart-item {
    background: white;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .cart-item .pizza-img { width: 50px; height: 50px; font-size: 26px; }
  
  .cart-item-info { flex: 1; }
  .cart-item-info h4 { font-size: 14px; margin-bottom: 4px; }
  .cart-item-info .price { font-size: 13px; color: #ff6b35; font-weight: 600; }
  
  .qty-control {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .qty-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid #ff6b35;
    background: white;
    color: #ff6b35;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
  }
  
  .qty-value { font-size: 14px; font-weight: 600; min-width: 20px; text-align: center; }
  
  /* ИТОГО */
  .total-card {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-top: 12px;
  }
  
  .total-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 14px;
    border-bottom: 1px solid #f5f5f5;
  }
  
  .total-row:last-child { border: none; font-size: 18px; font-weight: 700; color: #ff6b35; padding-top: 12px; }
  
  /* ЗАКАЗ */
  .order-status {
    background: white;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin-bottom: 12px;
  }
  
  .order-status .icon { font-size: 60px; margin-bottom: 12px; }
  .order-status h3 { font-size: 18px; margin-bottom: 8px; }
  .order-status p { font-size: 13px; color: #888; }
  
  .progress-bar {
    height: 8px;
    background: #f0f0f0;
    border-radius: 4px;
    overflow: hidden;
    margin: 16px 0;
  }
  
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff6b35, #f7931e);
    border-radius: 4px;
    transition: width 0.3s;
  }
  
  /* ПРОФИЛЬ */
  .profile-header {
    background: linear-gradient(135deg, #ff6b35, #f7931e);
    color: white;
    padding: 24px 20px;
    border-radius: 16px;
    text-align: center;
    margin-bottom: 12px;
  }
  
  .profile-avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 10px;
  }
  
  .card {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  
  .card h3 { font-size: 15px; margin-bottom: 10px; color: #333; }
  
  input, textarea, select {
    width: 100%;
    padding: 12px;
    border: 1.5px solid #ffe0cc;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 10px;
    font-family: inherit;
    outline: none;
    background: #fff;
  }
  
  input:focus, textarea:focus { border-color: #ff6b35; }
  
  .form-row {
    display: flex;
    gap: 8px;
  }
  
  /* ТОСТ */
  .toast {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 200;
    white-space: nowrap;
  }
  
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  
  .empty-cart {
    text-align: center;
    padding: 60px 20px;
    color: #888;
  }
  
  .empty-cart .icon { font-size: 70px; margin-bottom: 12px; }
  
  .promo-badge {
    display: inline-block;
    background: #26de81;
    color: white;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 8px;
    margin-left: 6px;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="screen">
    
    <!-- СТАТУС-БАР -->
    <div class="status-bar">
      <span id="statusTime">00:00</span>
      <div class="status-icons">
        <span>📶</span>
        <span>🔋</span>
      </div>
    </div>
    
    <!-- ХЕДЕР -->
    <div class="header">
      <h1>🍕 PizzaShop</h1>
      <button class="cart-btn" onclick="switchTab('cart')">
        🛒<span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
    
    <!-- КОНТЕНТ -->
    <div class="content" id="content">
      
      <!-- МЕНЮ -->
      <div class="tab-content active" id="tab-menu">
        <div class="categories">
          <button class="cat-btn active" onclick="filterCat('all', this)">Все</button>
          <button class="cat-btn" onclick="filterCat('classic', this)">Классика</button>
          <button class="cat-btn" onclick="filterCat('meat', this)">Мясные</button>
          <button class="cat-btn" onclick="filterCat('veg', this)">Вегетарианские</button>
          <button class="cat-btn" onclick="filterCat('spicy', this)">Острые</button>
        </div>
        
        <div id="pizzaList"></div>
      </div>
      
      <!-- КОРЗИНА -->
      <div class="tab-content" id="tab-cart">
        <div id="cartContent"></div>
      </div>
      
      <!-- ЗАКАЗ -->
      <div class="tab-content" id="tab-order">
        <div class="order-status">
          <div class="icon">🛵</div>
          <h3>Заказ №0001</h3>
          <p>Курьер уже в пути!</p>
          <div class="progress-bar">
            <div class="progress-fill" id="orderProgress" style="width: 20%;"></div>
          </div>
          <p style="font-size:12px; color:#ff6b35; font-weight:600;" id="orderEta">Ожидание: 30 мин</p>
        </div>
        
        <div class="card">
          <h3>📍 Адрес доставки</h3>
          <p style="font-size:13px; color:#666;">ул. Пушкина, д. 10, кв. 5</p>
        </div>
        
        <div class="card">
          <h3>📞 Контакт</h3>
          <p style="font-size:13px; color:#666;">+7 (999) 123-45-67</p>
        </div>
        
        <div class="empty-cart" style="padding: 30px 20px;">
          <p style="font-size:12px;">Изменить адрес нельзя 😅</p>
        </div>
      </div>
      
      <!-- ПРОФИЛЬ -->
      <div class="tab-content" id="tab-profile">
        <div class="profile-header">
          <div class="profile-avatar">👤</div>
          <h3>Иван Тестировщик</h3>
          <p style="font-size:12px; opacity:0.9;">+7 (999) 123-45-67</p>
        </div>
        
        <div class="card">
          <h3>💰 Мои бонусы</h3>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:13px; color:#888;">Баллы</span>
            <span style="font-size:20px; font-weight:700; color:#ff6b35;" id="bonusPoints">0</span>
          </div>
          <p style="font-size:11px; color:#888; margin-top:6px;">1 балл = 1 ₽ скидки</p>
        </div>
        
        <div class="card">
          <h3>⚙️ Настройки</h3>
          <input type="text" placeholder="Ваше имя" value="Иван">
          <input type="text" placeholder="Адрес доставки" value="ул. Пушкина, д. 10">
          <button class="btn btn-secondary" onclick="showToast('Сохранено!')">Сохранить</button>
        </div>
        
        <div class="card">
          <h3>🎁 Промокод</h3>
          <input type="text" id="promoInput" placeholder="Введите код" />
          <button class="btn" onclick="applyPromo()">Применить</button>
        </div>
      </div>
      
    </div>
    
    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <div class="bottom-nav">
      <button class="nav-item active" onclick="switchTab('menu', this)">
        <span class="nav-icon">🍕</span>
        <span>Меню</span>
      </button>
      <button class="nav-item" onclick="switchTab('cart', this)">
        <span class="nav-icon">🛒</span>
        <span>Корзина</span>
      </button>
      <button class="nav-item" onclick="switchTab('order', this)">
        <span class="nav-icon">🛵</span>
        <span>Заказ</span>
      </button>
      <button class="nav-item" onclick="switchTab('profile', this)">
        <span class="nav-icon">👤</span>
        <span>Профиль</span>
      </button>
    </div>
    
    <div class="toast" id="toast"></div>
    
  </div>
</div>

<script>
/* ============================================
   🐛 В ЭТОМ КОДЕ СПРЯТАНО 20+ БАГОВ
   ============================================ */

// ===== ДАННЫЕ =====
const pizzas = [
  { id: 1, name: 'Маргарита', desc: 'Томаты, моцарелла, базилик', price: 450, cat: 'classic', emoji: '🍕' },
  { id: 2, name: 'Пепперони', desc: 'Пепперони, моцарелла', price: 550, cat: 'meat', emoji: '🍕' },
  { id: 3, name: 'Четыре сыра', desc: 'Моцарелла, пармезан, дорблю, чеддер', price: 650, cat: 'classic', emoji: '🧀' },
  { id: 4, name: 'Гавайская', desc: 'Курица, ананас, моцарелла', price: 600, cat: 'meat', emoji: '🍍' },
  { id: 5, name: 'Вегетарианская', desc: 'Перец, грибы, лук, томаты', price: 500, cat: 'veg', emoji: '🥬' },
  { id: 6, name: 'Дьябло', desc: 'Острый перец, салями, халапеньо', price: 700, cat: 'spicy', emoji: '🌶' },
  { id: 7, name: 'Мясная', desc: 'Бекон, ветчина, пепперони', price: 750, cat: 'meat', emoji: '🥓' },
  { id: 8, name: 'Грибная', desc: 'Шампиньоны, моцарелла', price: 480, cat: 'veg', emoji: '🍄' }
];

let cart = [];
let currentCategory = 'all';
let bonusPoints = 0;
let promoDiscount = 0;
let orderStartTime = null;

// ===== НАВИГАЦИЯ =====
function switchTab(tabName, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tabName).classList.add('active');
  
  if (btn) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    btn.classList.add('active');
  }
  
  if (tabName === 'cart') renderCart();
  if (tabName === 'order') startOrderProgress();
}

// ===== МЕНЮ =====
function renderPizzas() {
  const list = document.getElementById('pizzaList');
  list.innerHTML = '';
  
  // БАГ #1: фильтр "spicy" показывает пиццы из категории "meat"
  let filtered = pizzas;
  if (currentCategory !== 'all') {
    if (currentCategory === 'spicy') {
      filtered = pizzas.filter(p => p.cat === 'meat'); // ← баг
    } else {
      filtered = pizzas.filter(p => p.cat === currentCategory);
    }
  }
  
  filtered.forEach(pizza => {
    const card = document.createElement('div');
    card.className = 'pizza-card';
    card.innerHTML = `
      <div class="pizza-img">${pizza.emoji}</div>
      <div class="pizza-info">
        <h3>${pizza.name}</h3>
        <p>${pizza.desc}</p>
        <div class="pizza-bottom">
          <span class="pizza-price">${pizza.price} ₽</span>
          <button class="add-btn" onclick="event.stopPropagation(); addToCart(${pizza.id})">+ В корзину</button>
        </div>
      </div>
    `;
    // БАГ #2: клик по карточке ничего не делает (нет деталей)
    list.appendChild(card);
  });
}

function filterCat(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPizzas();
  
  // БАГ #3: активная категория не подсвечивается (CSS удалён)
}

// ===== КОРЗИНА =====
function addToCart(id) {
  const pizza = pizzas.find(p => p.id === id);
  const existing = cart.find(item => item.id === id);
  
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ ...pizza, qty: 1 });
  }
  
  updateCartCount();
  showToast(`Добавлено: ${pizza.name}`);
  
  // БАГ #4: нельзя добавить пиццу с главного экрана, если корзина пустая
  // (на самом деле можно, но счётчик иногда врёт)
}

function updateCartCount() {
  const count = cart.reduce((sum, item) => sum + item.qty, 0);
  
  // БАГ #5: счётчик показывает количество ТОВАРОВ, а не пицц (иногда на 1 меньше)
  document.getElementById('cartCount').textContent = count > 0 ? count - 1 : 0;
}

function changeQty(id, delta) {
  const item = cart.find(i => i.id === id);
  if (!item) return;
  
  item.qty += delta;
  
  // БАГ #6: можно уйти в минус
  // if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
  
  updateCartCount();
  renderCart();
}

function renderCart() {
  const container = document.getElementById('cartContent');
  
  if (cart.length === 0) {
    container.innerHTML = `
      <div class="empty-cart">
        <div class="icon">🛒</div>
        <p>Корзина пуста</p>
      </div>
    `;
    return;
  }
  
  let html = '';
  cart.forEach(item => {
    html += `
      <div class="cart-item">
        <div class="pizza-img">${item.emoji}</div>
        <div class="cart-item-info">
          <h4>${item.name}</h4>
          <div class="price">${item.price} ₽</div>
        </div>
        <div class="qty-control">
          <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
          <span class="qty-value">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
        </div>
      </div>
    `;
  });
  
  // БАГ #7: сумма считается НЕПРАВИЛЬНО (умножает на 2)
  const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  const doubled = subtotal * 2;
  
  // БАГ #8: доставка всегда 0, хотя должна быть 150₽
  const delivery = 0;
  
  // БАГ #9: скидка применяется дважды
  const discount = promoDiscount * 2;
  
  html += `
    <div class="total-card">
      <div class="total-row">
        <span>Пиццы</span>
        <span>${doubled} ₽</span>
      </div>
      <div class="total-row">
        <span>Доставка</span>
        <span>${delivery} ₽</span>
      </div>
      ${discount > 0 ? `<div class="total-row" style="color:#26de81;">
        <span>Скидка</span>
        <span>−${discount} ₽</span>
      </div>` : ''}
      <div class="total-row">
        <span>Итого</span>
        <span>${doubled + delivery - discount} ₽</span>
      </div>
    </div>
    
    <button class="btn" style="margin-top:12px;" onclick="checkout()">Оформить заказ</button>
    <button class="btn btn-secondary" onclick="clearCart()">Очистить корзину</button>
  `;
  
  container.innerHTML = html;
  
  // БАГ #10: итог не пересчитывается при изменении количества
}

function clearCart() {
  cart = [];
  updateCartCount();
  renderCart();
  // БАГ #11: счётчик в хедере не сбрасывается в 0 (иногда)
}

// ===== ЗАКАЗ =====
function checkout() {
  if (cart.length === 0) {
    showToast('Корзина пуста!');
    return;
  }
  
  // БАГ #12: бонусы начисляются, но счётчик не обновляется
  bonusPoints += Math.floor(cart.reduce((s, i) => s + i.price * i.qty, 0) / 10);
  
  cart = [];
  updateCartCount();
  
  showToast('Заказ оформлен! 🎉');
  
  // БАГ #13: перебрасывает на вкладку "Заказ", но прогресс не стартует
  switchTab('order');
}

function startOrderProgress() {
  orderStartTime = Date.now();
  const progress = document.getElementById('orderProgress');
  const eta = document.getElementById('orderEta');
  
  // БАГ #14: прогресс растёт слишком быстро (30 сек = 30 мин)
  // БАГ #15: ETA не уменьшается, а растёт
  const interval = setInterval(() => {
    const elapsed = (Date.now() - orderStartTime) / 1000;
    const percent = Math.min(elapsed * 3.33, 100);
    progress.style.width = percent + '%';
    
    // ETA должно уменьшаться, а тут растёт
    eta.textContent = `Ожидание: ${Math.floor(elapsed)} мин`;
    
    if (percent >= 100) {
      clearInterval(interval);
      eta.textContent = 'Доставлено! ✅';
    }
  }, 1000);
}

// ===== ПРОМОКОД =====
function applyPromo() {
  const input = document.getElementById('promoInput');
  const code = input.value.trim().toUpperCase();
  
  // БАГ #16: промокод PIZZA10 работает, но скидка 0
  // БАГ #17: любой код принимается как "валидный"
  if (code === 'PIZZA10') {
    promoDiscount = 0; // ← баг: должно быть 10% или 100₽
    showToast('Промокод применён!');
  } else {
    promoDiscount = 50; // ← баг: любой код даёт скидку
    showToast('Промокод применён!');
  }
  
  renderCart();
  input.value = '';
}

// ===== ПРОФИЛЬ =====
// БАГ #18: bonusPoints не отображается в профиле
// (в HTML есть элемент bonusPoints, но он не обновляется)

// ===== ТОСТ =====
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ===== СТАТУС-БАР =====
function updateClock() {
  const now = new Date();
  const h = now.getHours().toString().padStart(2, '0');
  const m = now.getMinutes().toString().padStart(2, '0');
  document.getElementById('statusTime').textContent = h + ':' + m;
  
  // БАГ #19: часы иногда показывают 24:00 вместо 00:00
}

// БАГ #20: часы обновляются раз в 60 секунд, а не каждую секунду
setInterval(updateClock, 60000);
updateClock();

// ===== ИНИЦИАЛИЗАЦИЯ =====
renderPizzas();
</script>
